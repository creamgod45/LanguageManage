plugin.name=Lokalisierungsverwaltung (LanguageManager)
plugin.description=<h3>Deutsche Beschreibung</h3><p>Verwaltet Lokalisierungsdateien in JSON, YAML, Laravel PHP und ResourceBundle Properties. Erstellen Sie voneinander getrennte Dateischemas, suchen und bearbeiten Sie Übersetzungen in einer verknüpften Tabelle, erkennen Sie fehlerhafte Dateien und prüfen Sie fehlende Werte, Duplikate, fehlende Locales und Nutzungsvorschläge.</p><h3>English Description</h3><p>Manage JSON, YAML, Laravel PHP, and ResourceBundle Properties localization files. Create isolated file schemes, search and edit translations in a joined table, detect malformed files, and review missing values, duplicates, missing locales, and usage suggestions.</p>
